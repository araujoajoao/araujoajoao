<svg width="680" height="286" viewBox="0 0 680 286" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Terminal profile — João Araújo</title>
  <desc>Terminal window showing DevOps, SRE, and Cloud profile info for João Araújo</desc>

  <!-- Outer Window Background (Tokyo Night Deep Dark) -->
  <rect x="0" y="0" width="680" height="286" rx="10" fill="#0d0f17"/>

  <!-- Top Header Bar -->
  <rect x="0" y="0" width="680" height="36" rx="10" fill="#131621"/>
  <rect x="0" y="24" width="680" height="12" fill="#131621"/>
  <line x1="1" y1="36" x2="679" y2="36" stroke="#1f2335" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="22" cy="18" r="5.5" fill="#f7768e"/>
  <circle cx="40" cy="18" r="5.5" fill="#e0af68"/>
  <circle cx="58" cy="18" r="5.5" fill="#9ece6a"/>

  <!-- Window Title & Shell -->
  <text x="340" y="22" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#565f89">joao@devops: ~</text>
  <text x="656" y="22" text-anchor="end" font-family="monospace" font-size="11" fill="#414868">zsh</text>

  <!-- Command 1: whoami -->
  <text x="28" y="66" font-family="monospace" font-size="13" font-weight="bold" fill="#7aa2f7">$</text>
  <text x="44" y="66" font-family="monospace" font-size="13" font-weight="bold" fill="#c0caf5">whoami</text>

  <text x="28" y="88" font-family="monospace" font-size="13" font-weight="bold" fill="#bb9af7">João Araújo</text>
  <text x="134" y="88" font-family="monospace" font-size="13" font-weight="bold" fill="#7dcfff">DevOps · SRE · Cloud</text>

  <!-- Command 2: ls skills/ (Ordered by increasing difficulty in a clean 6x2 tabular grid) -->
  <text x="28" y="118" font-family="monospace" font-size="13" font-weight="bold" fill="#7aa2f7">$</text>
  <text x="44" y="118" font-family="monospace" font-size="13" font-weight="bold" fill="#c0caf5">ls skills/</text>

  <!-- Row 1: Foundations to Pipelines -->
  <text x="28"  y="140" font-family="monospace" font-size="13" font-weight="bold" fill="#9ece6a">git/</text>
  <text x="112" y="140" font-family="monospace" font-size="13" font-weight="bold" fill="#9ece6a">linux/</text>
  <text x="204" y="140" font-family="monospace" font-size="13" font-weight="bold" fill="#9ece6a">bash/</text>
  <text x="316" y="140" font-family="monospace" font-size="13" font-weight="bold" fill="#9ece6a">python/</text>
  <text x="416" y="140" font-family="monospace" font-size="13" font-weight="bold" fill="#9ece6a">docker/</text>
  <text x="536" y="140" font-family="monospace" font-size="13" font-weight="bold" fill="#9ece6a">cicd/</text>

  <!-- Row 2: Cloud, IaC, Observability & Orchestration -->
  <text x="28"  y="162" font-family="monospace" font-size="13" font-weight="bold" fill="#9ece6a">aws/</text>
  <text x="112" y="162" font-family="monospace" font-size="13" font-weight="bold" fill="#9ece6a">gcp/</text>
  <text x="204" y="162" font-family="monospace" font-size="13" font-weight="bold" fill="#9ece6a">terraform/</text>
  <text x="316" y="162" font-family="monospace" font-size="13" font-weight="bold" fill="#9ece6a">datadog/</text>
  <text x="416" y="162" font-family="monospace" font-size="13" font-weight="bold" fill="#9ece6a">kubernetes/</text>
  <text x="536" y="162" font-family="monospace" font-size="12" font-weight="bold" fill="#565f89">
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.6s" repeatCount="indefinite"/>loading...
  </text>

  <!-- Command 3: echo $MOTTO (Dynamic Rotating Mottos) -->
  <style>
    @keyframes motto0 { 0%, 17% { opacity: 1; } 20%, 97% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes motto1 { 0%, 17% { opacity: 0; } 20%, 37% { opacity: 1; } 40%, 100% { opacity: 0; } }
    @keyframes motto2 { 0%, 37% { opacity: 0; } 40%, 57% { opacity: 1; } 60%, 100% { opacity: 0; } }
    @keyframes motto3 { 0%, 57% { opacity: 0; } 60%, 77% { opacity: 1; } 80%, 100% { opacity: 0; } }
    @keyframes motto4 { 0%, 77% { opacity: 0; } 80%, 97% { opacity: 1; } 100% { opacity: 0; } }
    .m0 { animation: motto0 15s infinite; }
    .m1 { animation: motto1 15s infinite; opacity: 0; }
    .m2 { animation: motto2 15s infinite; opacity: 0; }
    .m3 { animation: motto3 15s infinite; opacity: 0; }
    .m4 { animation: motto4 15s infinite; opacity: 0; }
  </style>

  <text x="28" y="192" font-family="monospace" font-size="13" font-weight="bold" fill="#7aa2f7">$</text>
  <text x="44" y="192" font-family="monospace" font-size="13" font-weight="bold" fill="#c0caf5">echo $MOTTO</text>

  <g font-family="monospace" font-size="13" font-weight="bold" fill="#e0af68">
    <text x="28" y="214" class="m0">"You can't improve what you don't measure."</text>
    <text x="28" y="214" class="m1">"Hope is not a strategy."</text>
    <text x="28" y="214" class="m2">"Automate everything you do more than twice."</text>
    <text x="28" y="214" class="m3">"Everything fails, all the time."</text>
    <text x="28" y="214" class="m4">"Infrastructure as Code or it didn't happen."</text>
  </g>

  <!-- Active Prompt & Blinking Cursor -->
  <text x="28" y="238" font-family="monospace" font-size="13" font-weight="bold" fill="#7aa2f7">$</text>
  <rect x="44" y="226" width="8" height="14" rx="1" fill="#bb9af7" opacity="0.9">
    <animate attributeName="opacity" values="0.95;0;0.95" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Minimalist Status Bar Footer -->
  <rect x="0" y="254" width="680" height="32" rx="10" fill="#131621"/>
  <rect x="0" y="254" width="680" height="12" fill="#131621"/>
  <line x1="1" y1="254" x2="679" y2="254" stroke="#1f2335" stroke-width="1"/>

  <!-- Status Bar Left: Live Dot & Session -->
  <circle cx="22" cy="270" r="3" fill="#9ece6a">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="32" y="274" font-family="monospace" font-size="11" fill="#414868">main</text>

  <!-- Status Bar Center: Built with Google AI Pro -->
  <text x="326" y="274" text-anchor="end" font-family="monospace" font-size="11" fill="#565f89">built with</text>
  <text x="334" y="274" text-anchor="start" font-family="monospace" font-size="11" font-weight="bold" fill="#7dcfff">Google AI Pro</text>

  <!-- Status Bar Right: Encoding -->
  <text x="656" y="274" text-anchor="end" font-family="monospace" font-size="11" fill="#414868">utf-8</text>

  <!-- Outer Crisp Border -->
  <rect x="0.5" y="0.5" width="679" height="285" rx="9.5" fill="none" stroke="#24283b" stroke-width="1"/>
</svg>
